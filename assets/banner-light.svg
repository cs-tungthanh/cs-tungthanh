<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Tung Thanh — Software Engineer and Solution Architect">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#eaeef2"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="319" rx="16" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="1" y="1" width="1198" height="318" rx="16" fill="url(#grid)"/>
  <rect x="1" y="1" width="700" height="318" rx="16" fill="url(#fade)"/>

  <!-- window chrome -->
  <circle cx="32" cy="30" r="6" fill="#ff5f57"/>
  <circle cx="52" cy="30" r="6" fill="#febc2e"/>
  <circle cx="72" cy="30" r="6" fill="#28c840"/>

  <!-- intro -->
  <text x="64" y="104" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" fill="#59636e"><tspan fill="#0f766e">$</tspan> whoami<tspan fill="#0f766e">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>▍</tspan></text>
  <text x="62" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#1f2328" letter-spacing="-1">Tung Thanh</text>
  <text x="64" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="22" fill="#59636e">Software Engineer · Solution Architect</text>
  <text x="64" y="262" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" fill="#0f766e">solve() <tspan fill="#59636e">→</tspan> build() <tspan fill="#59636e">→</tspan> ship()</text>

  <!-- architecture sketch -->
  <path d="M810,160.0 L850,160.0" fill="none" stroke="#59636e" stroke-opacity="0.55" stroke-width="1.5"/>
  <path d="M970,160.0 C1010,160.0 980,92.0 1020,92.0" fill="none" stroke="#59636e" stroke-opacity="0.55" stroke-width="1.5"/>
  <path d="M970,160.0 C1010,160.0 980,228.0 1020,228.0" fill="none" stroke="#59636e" stroke-opacity="0.55" stroke-width="1.5"/>
  <path d="M1080.0,250 L1080.0,274" fill="none" stroke="#59636e" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="3 4"/>
  <circle r="4" fill="#0f766e" opacity="0"><animateMotion dur="2.6s" begin="0s" repeatCount="indefinite" path="M810,160.0 L850,160.0 L970,160.0 C1010,160.0 980,92.0 1020,92.0"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2.6s" begin="0s" repeatCount="indefinite"/></circle>
  <circle r="4" fill="#0969da" opacity="0"><animateMotion dur="2.6s" begin="1.3s" repeatCount="indefinite" path="M810,160.0 L850,160.0 L970,160.0 C1010,160.0 980,228.0 1020,228.0"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2.6s" begin="1.3s" repeatCount="indefinite"/></circle>
  <rect x="690" y="138" width="120" height="44" rx="8" fill="#f6f8fa" stroke="#d0d7de"/><text x="750.0" y="165" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#1f2328">client</text><rect x="850" y="138" width="120" height="44" rx="8" fill="#f6f8fa" stroke="#d0d7de"/><text x="910.0" y="165" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#1f2328">api-gateway</text><rect x="1020" y="70" width="120" height="44" rx="8" fill="#f6f8fa" stroke="#d0d7de"/><text x="1080.0" y="97" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#1f2328">go-service</text><rect x="1020" y="206" width="120" height="44" rx="8" fill="#f6f8fa" stroke="#d0d7de"/><text x="1080.0" y="233" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#1f2328">node-service</text>
  <rect x="1020" y="274" width="72" height="26" rx="13" fill="none" stroke="#d0d7de"/><text x="1056" y="291" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#59636e">postgres</text><rect x="1100" y="274" width="72" height="26" rx="13" fill="none" stroke="#d0d7de"/><text x="1136" y="291" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#59636e">redis</text>
</svg>
